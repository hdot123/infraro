name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run actionlint
        uses: reviewdog/action-actionlint@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-check
          level: error

      - name: Run markdownlint
        uses: articulate/actions-markdownlint@v1
        with:
          files: .
          config: .markdownlint.json

  # ─── substrate gates: advisory (step-level continue-on-error) ───
  # 五道门先红着上线（substrate-gate-suite 裁定 2026-09-13）：门照常运行并
  # 如实输出红/绿；存量红项逐条登记于 substrate/gate0-exemptions.md
  # （owner + 归属 feature）。机械形态：continue-on-error: true 加在每个
  # 门步级——门红留在步日志、check-run 记 success（实证引擎仓 run
  # 34760620069：job 级 c-o-e 的 check-run 仍记 failure，故必须步级）；
  # job 级刻意不加（infra 失败保持红可见）；刻意不进 ci-ok needs
  # （存量红不阻断合并）。门0/门1/门3 在声明仓常驻；门2 cron 与门4
  # 断言/bootstrap 为引擎仓所有。引擎接口面经 cross-repo checkout 注入
  # ENGINE_REPO_DIR（公开仓，GITHUB_TOKEN 可读）；引用实存性经
  # git ls-remote / gh api 核验。
  gate-tests:
    name: substrate-gate-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout declaration repo
        uses: actions/checkout@v4

      - name: Checkout engine repo (interface source of truth)
        uses: actions/checkout@v4
        with:
          repository: hdot123/infraro-core
          path: infraro-core
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install pyyaml

      - name: "Substrate gate 0: coverage completeness"
        continue-on-error: true
        env:
          ENGINE_REPO_DIR: ${{ github.workspace }}/infraro-core
        run: python substrate/gates/gate0_coverage.py

      - name: "Substrate gate 1: interface reality"
        continue-on-error: true
        env:
          ENGINE_REPO_DIR: ${{ github.workspace }}/infraro-core
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python substrate/gates/gate1_interface.py

      - name: "Substrate gate 3: public exposure scan"
        continue-on-error: true
        run: python substrate/gates/gate3_exposure.py

  ci-ok:
    needs: [lint]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check lint job status
        run: |
          lint_result="${{ needs.lint.result }}"
          if [[ "$lint_result" == "success" ]]; then
            echo "CI status: green"
            exit 0
          else
            echo "CI status: red"
            exit 1
          fi
