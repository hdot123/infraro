# Droid Auto Review thin caller（声明仓模板，对应引擎 reusable workflow）
# 复制后保持 name: Droid Auto Review（branch protection / ci-ok 依赖该名）。
# 调用引擎仓 reusable workflow（hdot123/infraro-core/.github/workflows/droid-review-shards.yml）
# 通过 workflow_call 接口，保持与消费层模板相同的 thin-caller 模式。

name: Droid Auto Review

on:
  pull_request_target:
    types: [opened, ready_for_review, reopened, synchronize]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number (for manual runs)'
        required: false
        type: string
      head_sha:
        description: 'Head SHA override (for manual runs)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || inputs.pr_number || github.ref }}
  cancel-in-progress: true

jobs:
  # ── Job 0: Setup - resolve PR context for both trigger types ──
  setup:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      pr_number: ${{ steps.resolve.outputs.pr_number }}
      base_sha: ${{ steps.resolve.outputs.base_sha }}
      head_sha: ${{ steps.resolve.outputs.head_sha }}
      draft: ${{ steps.resolve.outputs.draft }}
      user_login: ${{ steps.resolve.outputs.user_login }}
    steps:
      - name: Resolve PR context
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Fork guard (fail-closed): reject pull_request_target from forks.
          if [ "${{ github.event_name }}" = "pull_request_target" ]; then
            if [ "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]; then
              echo "::error::fork PR rejected by droid-review fork guard (head=${{ github.event.pull_request.head.repo.full_name }}, repo=${{ github.repository }})"
              exit 1
            fi
          fi

          # Dispatch branch whitelist guard (fail-closed, step level).
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            PR_NUMBER="${{ inputs.pr_number }}"
            HEAD_SHA="${{ inputs.head_sha }}"
            
            if [ -z "$PR_NUMBER" ]; then
              echo "::error::Manual dispatch requires pr_number input"
              exit 1
            fi
            
            BRANCH="${{ github.ref }}"
            case "$BRANCH" in
              refs/heads/main|refs/heads/hotfix/*|refs/heads/feature/*)
                echo "Dispatch branch $BRANCH is whitelisted"
                ;;
              *)
                echo "::error::workflow_dispatch rejected by droid-review dispatch guard (ref=${BRANCH})"
                exit 1
                ;;
            esac
          fi

          if [ "${{ github.event_name }}" = "pull_request_target" ]; then
            # pull_request_target trigger: use event context
            {
              echo "pr_number=${{ github.event.pull_request.number }}"
              echo "base_sha=${{ github.event.pull_request.base.sha }}"
              echo "head_sha=${{ github.event.pull_request.head.sha }}"
              echo "draft=${{ github.event.pull_request.draft }}"
              echo "user_login=${{ github.event.pull_request.user.login }}"
            } >> "$GITHUB_OUTPUT"
            echo "Resolved PR context from pull_request_target event"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # workflow_dispatch trigger: fetch PR data via API
            PR_NUMBER="${{ inputs.pr_number }}"
            echo "Fetching PR #$PR_NUMBER data via API..."

            PR_DATA=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")
            BASE_SHA=$(echo "$PR_DATA" | jq -r '.base.sha')
            HEAD_SHA="${{ inputs.head_sha }}"
            if [ -z "$HEAD_SHA" ] || [ "$HEAD_SHA" = "null" ]; then
              HEAD_SHA=$(echo "$PR_DATA" | jq -r '.head.sha')
            fi
            DRAFT=$(echo "$PR_DATA" | jq -r '.draft')
            USER_LOGIN=$(echo "$PR_DATA" | jq -r '.user.login')

            {
              echo "pr_number=$PR_NUMBER"
              echo "base_sha=$BASE_SHA"
              echo "head_sha=$HEAD_SHA"
              echo "draft=$DRAFT"
              echo "user_login=$USER_LOGIN"
            } >> "$GITHUB_OUTPUT"
            echo "Resolved PR context from workflow_dispatch (PR #$PR_NUMBER, head=$HEAD_SHA)"
          else
            echo "::error::Unsupported event name: ${{ github.event_name }}"
            exit 1
          fi

  # ── Job 1: Call reusable droid-review-shards workflow ──
  call-shards:
    needs: setup
    uses: hdot123/infraro-core/.github/workflows/droid-review-shards.yml@v0.18.7
    with:
      pr_number: ${{ needs.setup.outputs.pr_number }}
      head_sha: ${{ needs.setup.outputs.head_sha }}
      shard_max_files: ${{ vars.SHARD_MAX_FILES || '25' }}
      shard_max_count: ${{ vars.SHARD_MAX_COUNT || '6' }}
      shard_timeout_minutes: ${{ vars.SHARD_TIMEOUT_MINUTES || '45' }}
      shard_max_parallel: ${{ vars.SHARD_MAX_PARALLEL || '3' }}
    secrets:
      factory_api_key: ${{ secrets.FACTORY_API_KEY }}
      nvidia_kong_proxy_key: ${{ secrets.NVIDIA_KONG_PROXY_KEY }}
      lumivane_cfat: ${{ secrets.LUMIVANE_CFAT }}

  # ── Job 2: Aggregate and publish findings ──
  droid-review:
    needs: [setup, call-shards]
    if: >-
      always() &&
      needs.call-shards.result == 'success' &&
      needs.call-shards.outputs.plan_shards_ok == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(vars.DROID_REVIEW_TIMEOUT_MINUTES || '90') }}
    permissions:
      contents: read        # checkout (BASE)
      pull-requests: write  # publish findings as PR comment via gh api
      issues: write         # gh api may post to issues
      actions: write        # download-artifact (read+write scope; download requires actions:write)
    steps:
      - name: Workspace guard (sparse residue detox)
        run: |
          set -euo pipefail
          # 2026-08-28 污染事故运行时排毒：共享持久 _work 工作区的 sparse 残留
          # 使 checkout 自带的 sparse-checkout disable 无法恢复被裁剪的工作树
          # （实证：disable 后仍缺 .github/actions/setup-venv）。本步在
          # checkout 前检测残留并删除 .git 强制全新克隆；必须内联 run——
          # 工作树残缺时本地 composite action 同样无法解析。
          if [ -e "$GITHUB_WORKSPACE/.git" ]; then
            SPARSE_FLAG=$(git -C "$GITHUB_WORKSPACE" config --type=bool --get core.sparseCheckout 2>/dev/null || echo false)
            if [ "$SPARSE_FLAG" = "true" ] || [ ! -f "$GITHUB_WORKSPACE/.github/actions/setup-venv/action.yml" ]; then
              echo "::warning::Workspace has sparse/prune residue; removing .git for a clean re-clone"
              rm -rf "$GITHUB_WORKSPACE/.git"
            fi
          fi

      - name: Checkout repository (BASE)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.setup.outputs.base_sha }}
          fetch-depth: 1

      - name: Setup venv (per-run isolation)
        uses: ./.github/actions/setup-venv

      - name: Check shard results
        id: check_results
        env:
          PR_NUMBER: ${{ needs.setup.outputs.pr_number }}
          HEAD_SHA: ${{ needs.setup.outputs.head_sha }}
          DOCS_ONLY: ${{ needs.call-shards.outputs.docs_only }}
          SHARDS: ${{ needs.call-shards.outputs.shards }}
        run: |
          set -euo pipefail

          if [ "$DOCS_ONLY" = "true" ]; then
            echo "docs-only PR — skipping aggregation"
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$SHARDS" = "[]" ] || [ -z "$SHARDS" ]; then
            echo "no shards planned — skipping aggregation"
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "should_publish=true" >> "$GITHUB_OUTPUT"

      - name: Download findings artifacts
        if: steps.check_results.outputs.should_publish == 'true'
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: droid-review-debug-${{ github.run_id }}-shard-*
          path: findings/

      - name: Publish findings
        if: steps.check_results.outputs.should_publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ needs.setup.outputs.pr_number }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_ID: ${{ needs.setup.outputs.head_sha }}
        run: |
          set -euo pipefail
          python3 scripts/droid_review/publish_findings.py \
            --pattern "findings/*/findings-shard-*.json" \
            --pr-number "$PR_NUMBER" \
            --repository "$REPOSITORY" \
            --commit-id "$COMMIT_ID"
