# Droid Auto Review thin caller（声明仓模板，对应引擎 reusable workflow）
# 复制后保持 name: Droid Auto Review（branch protection / ci-ok 依赖该名）。
# 调用引擎仓 reusable workflow（hdot123/infraro-core/.github/workflows/droid-review-shards.yml）
# 通过 workflow_call 接口，保持与消费层模板相同的 thin-caller 模式。

name: Droid Auto Review

on:
  pull_request_target:
    types: [opened, ready_for_review, reopened, synchronize]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number (for manual runs)'
        required: false
        type: string
      head_sha:
        description: 'Head SHA override (for manual runs)'
        required: false
        type: string
      shard_max_files:
        description: 'Max files per shard (default: 25)'
        required: false
        type: string
        default: '25'
      shard_max_count:
        description: 'Max shard count (default: 6)'
        required: false
        type: string
        default: '6'
      shard_timeout_minutes:
        description: 'Shard timeout in minutes (default: 45)'
        required: false
        type: string
        default: '45'
      shard_max_parallel:
        description: 'Max parallel shards (default: 3)'
        required: false
        type: string
        default: '3'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || inputs.pr_number || github.ref }}
  cancel-in-progress: true

jobs:
  # ── Job 0: Setup - resolve PR context for both trigger types ──
  setup:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      pr_number: ${{ steps.resolve.outputs.pr_number }}
      base_sha: ${{ steps.resolve.outputs.base_sha }}
      head_sha: ${{ steps.resolve.outputs.head_sha }}
      draft: ${{ steps.resolve.outputs.draft }}
      user_login: ${{ steps.resolve.outputs.user_login }}
    steps:
      - name: Resolve PR context
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Fork guard (fail-closed): reject pull_request_target from forks.
          if [ "${{ github.event_name }}" = "pull_request_target" ]; then
            if [ "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]; then
              echo "::error::fork PR rejected by droid-review fork guard (head=${{ github.event.pull_request.head.repo.full_name }}, repo=${{ github.repository }})"
              exit 1
            fi
          fi

          # Dispatch branch whitelist guard (fail-closed, step level).
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            PR_NUMBER="${{ inputs.pr_number }}"
            HEAD_SHA="${{ inputs.head_sha }}"
            
            if [ -z "$PR_NUMBER" ]; then
              echo "::error::Manual dispatch requires pr_number input"
              exit 1
            fi
            
            BRANCH="${{ github.ref }}"
            case "$BRANCH" in
              refs/heads/main|refs/heads/hotfix/*|refs/heads/feature/*)
                echo "Dispatch branch $BRANCH is whitelisted"
                ;;
              *)
                echo "::error::workflow_dispatch rejected by droid-review dispatch guard (ref=${BRANCH})"
                exit 1
                ;;
            esac
          fi

          if [ "${{ github.event_name }}" = "pull_request_target" ]; then
            # pull_request_target trigger: use event context
            {
              echo "pr_number=${{ github.event.pull_request.number }}"
              echo "base_sha=${{ github.event.pull_request.base.sha }}"
              echo "head_sha=${{ github.event.pull_request.head.sha }}"
              echo "draft=${{ github.event.pull_request.draft }}"
              echo "user_login=${{ github.event.pull_request.user.login }}"
            } >> "$GITHUB_OUTPUT"
            echo "Resolved PR context from pull_request_target event"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # workflow_dispatch trigger: fetch PR data via API
            PR_NUMBER="${{ inputs.pr_number }}"
            echo "Fetching PR #$PR_NUMBER data via API..."

            PR_DATA=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")
            BASE_SHA=$(echo "$PR_DATA" | jq -r '.base.sha')
            HEAD_SHA="${{ inputs.head_sha }}"
            if [ -z "$HEAD_SHA" ] || [ "$HEAD_SHA" = "null" ]; then
              HEAD_SHA=$(echo "$PR_DATA" | jq -r '.head.sha')
            fi
            DRAFT=$(echo "$PR_DATA" | jq -r '.draft')
            USER_LOGIN=$(echo "$PR_DATA" | jq -r '.user.login')

            {
              echo "pr_number=$PR_NUMBER"
              echo "base_sha=$BASE_SHA"
              echo "head_sha=$HEAD_SHA"
              echo "draft=$DRAFT"
              echo "user_login=$USER_LOGIN"
            } >> "$GITHUB_OUTPUT"
            echo "Resolved PR context from workflow_dispatch (PR #$PR_NUMBER, head=$HEAD_SHA)"
          else
            echo "::error::Unsupported event name: ${{ github.event_name }}"
            exit 1
          fi

  # ── Job 1: Droid Auto Review (calls reusable workflow) ──
  # Note: Job calling reusable workflow cannot specify runs-on - runner is
  # determined by the reusable workflow (droid-review-shards.yml uses ubuntu-latest)
  # and cannot be overridden by caller. Permissions declared here apply to the
  # entire job including the called workflow.
  droid-auto-review:
    needs: setup
    permissions:
      contents: read
      pull-requests: read
      actions: write
    uses: hdot123/infraro-core/.github/workflows/droid-review-shards.yml@v0.18.7
    with:
      pr_number: ${{ needs.setup.outputs.pr_number }}
      head_sha: ${{ needs.setup.outputs.head_sha }}
      shard_max_files: ${{ vars.SHARD_MAX_FILES || '25' }}
      shard_max_count: ${{ vars.SHARD_MAX_COUNT || '6' }}
      shard_timeout_minutes: ${{ vars.SHARD_TIMEOUT_MINUTES || '45' }}
      shard_max_parallel: ${{ vars.SHARD_MAX_PARALLEL || '3' }}
    secrets:
      factory_api_key: ${{ secrets.FACTORY_API_KEY }}
      nvidia_kong_proxy_key: ${{ secrets.NVIDIA_KONG_PROXY_KEY }}
      lumivane_cfat: ${{ secrets.LUMIVANE_CFAT }}

  # ── Job 2: Aggregate and publish findings using composite action ──
  droid-review:
    needs: [setup, droid-auto-review]
    if: >-
      always() &&
      needs.droid-auto-review.result == 'success' &&
      needs.droid-auto-review.outputs.plan_shards_ok == 'true'
    runs-on: [self-hosted, pve-linux]
    timeout-minutes: ${{ fromJSON(vars.DROID_REVIEW_TIMEOUT_MINUTES || '90') }}
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: read
    steps:
      - name: Checkout repository (BASE)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.setup.outputs.base_sha }}
          fetch-depth: 1

      - name: Run droid-review-aggregate composite action
        uses: hdot123/infraro-core/actions/droid-review-aggregate@3695445b1d8df8997de35d39256ffe596d229c8c
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pr-number: ${{ needs.setup.outputs.pr_number }}
          head-sha: ${{ needs.setup.outputs.head_sha }}
          docs-only: ${{ needs.droid-auto-review.outputs.docs_only }}
          shards: ${{ needs.droid-auto-review.outputs.shards }}
          shards-result: ${{ needs.droid-auto-review.result }}
