# Droid Auto Review thin caller（声明仓，对齐消费仓 r38 可运行形态）。
#
# 三契约（对齐引擎 droid-review-shards.yml 文件头，NEVER break）：
#   1. Workflow 名 "Droid Auto Review"（watchdog/auto-merge 的 workflow_run
#      监听按此名过滤；本名同时是引擎侧 caller 命名契约）
#   2. Artifact 前缀 "droid-review-debug-"（watchdog quota-sweep 依赖，由
#      引擎 reusable 上传）
#   3. 聚合 job key `droid-review`（caller 本地 job——reusable 内部 job 的
#      check 名会变 `外层/内层` 嵌套格式，精确名契约必须由 caller 本地 job
#      跑 composite action 保持；ruleset required 的 check 名即 droid-review）
#
# 安全模型：pull_request_target 从 BASE main 取本文件定义（secrets 不泄露给
# PR head）；分片流水线委托引擎 reusable，聚合发布留在本地。fork guard
# 由引擎 reusable 的 setup job 承载（fail-closed，本文件不重复实现）。
# shard 参数 `|| 默认值` 兜底：pull_request_target 事件下 inputs 上下文为空，
# 不兜底会向 callee 传空串导致 fromJSON 失败（消费仓 PR #7 实证加固）。

name: Droid Auto Review

on:
  pull_request_target:
    types: [opened, ready_for_review, reopened, synchronize]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number (for manual runs)'
        required: false
        type: string
      head_sha:
        description: 'Head SHA override (for manual runs)'
        required: false
        type: string
      shard_max_files:
        description: 'Max files per shard (default: 25)'
        required: false
        type: string
        default: '25'
      shard_max_count:
        description: 'Max shard count (default: 6)'
        required: false
        type: string
        default: '6'
      shard_timeout_minutes:
        description: 'Shard timeout in minutes (default: 45)'
        required: false
        type: string
        default: '45'
      shard_max_parallel:
        description: 'Max parallel shards (default: 3)'
        required: false
        type: string
        default: '3'

permissions:
  contents: read
  pull-requests: read
  actions: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || inputs.pr_number || github.ref }}
  cancel-in-progress: true

jobs:
  # ── Job 1: Droid Auto Review (calls reusable workflow) ──
  # Job calling reusable workflow cannot specify runs-on；PR 上下文解析
  # （含 fork guard / dispatch 上下文解析）由 callee setup job 承载。
  droid-auto-review:
    uses: hdot123/infraro-core/.github/workflows/droid-review-shards.yml@v0.18.9
    permissions:
      contents: read
      pull-requests: read
      actions: write
    with:
      pr_number: ${{ inputs.pr_number }}
      head_sha: ${{ inputs.head_sha }}
      shard_max_files: ${{ inputs.shard_max_files || '25' }}
      shard_max_count: ${{ inputs.shard_max_count || '6' }}
      shard_timeout_minutes: ${{ inputs.shard_timeout_minutes || '45' }}
      shard_max_parallel: ${{ inputs.shard_max_parallel || '3' }}
    secrets:
      factory_api_key: ${{ secrets.FACTORY_API_KEY }}
      nvidia_kong_proxy_key: ${{ secrets.NVIDIA_KONG_PROXY_KEY }}
      lumivane_cfat: ${{ secrets.LUMIVANE_CFAT }}

  # ── Job 2: Aggregate and publish findings using engine composite action ──
  # 必须留在本地 job（reusable 内部 job 的 check 名会变嵌套格式）；
  # composite 自包含（$GITHUB_ACTION_PATH 解析 + download-artifact），无需 checkout。
  droid-review:
    name: droid-review
    needs: [droid-auto-review]
    if: ${{ always() && needs.droid-auto-review.outputs.plan_shards_ok == 'true' }}
    # ubuntu-latest（引擎自仓同位形态，run 35257546748 实证）：infraro 无
    # self-hosted runner 服务（近 100 run 全 hosted，ce-01 只服务消费仓且
    # 注册面 SSH 边界不可达），[self-hosted, pve-linux] 会永久排队。
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: read
    steps:
      - name: Aggregate and publish findings
        uses: hdot123/infraro-core/actions/droid-review-aggregate@3695445b1d8df8997de35d39256ffe596d229c8c # v0.18.5 pin
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pr-number: ${{ needs.droid-auto-review.outputs.pr_number }}
          head-sha: ${{ needs.droid-auto-review.outputs.head_sha }}
          docs-only: ${{ needs.droid-auto-review.outputs.docs_only }}
          shards: ${{ needs.droid-auto-review.outputs.shards }}
          shards-result: ${{ needs.droid-auto-review.result }}
