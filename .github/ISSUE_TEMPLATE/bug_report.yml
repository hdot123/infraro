name: Bug Report
description: 报告一个缺陷（复现步骤、期望/实际行为）
labels: ["bug", "needs-triage"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: 缺陷描述
      description: 发生了什么？与期望行为的差异是什么？
      placeholder: 简述缺陷与影响面（本仓为声明/模板层，请说明受影响的消费仓）。
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: 复现步骤
      description: 最小复现序列（命令/操作步骤）。
      placeholder: |
        1. 运行 `...`
        2. 观察 ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望行为
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 环境
      description: 消费仓名、workflow 引用版本（如 v0.18.9）、Python 版本。
      placeholder: "consumer-a / v0.18.9 / Python 3.12.x"
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: 相关日志/输出
      description: 请粘贴文本日志（勿截图），敏感信息先脱敏。
      render: shell
    validations:
      required: false
