name: Watchdog
on:
  schedule:
    - cron: '30 */2 * * *'  # Every 2 hours at 30 minutes past the hour (avoiding peak times)
  workflow_dispatch:
  workflow_call:
    inputs:
      engine_ref:
        required: false
        type: string
        description: "Engine ref to use"
    secrets:
      dispatch_token:
        required: true
        description: "PAT (hdot123) for issue/label writes and self-heal dispatch"
      dispatch-token:
        required: false
        description: "hyphen 过渡变体（与 dispatch_token 等价；env 层熔合 snake || hyphen）"
jobs:
  watchdog:
    uses: hdot123/infraro-core/.github/workflows/droid-review-watchdog-handlers.yml@v0.18.4
    with:
      engine_ref: ${{ inputs.engine_ref }}
    secrets:
      dispatch_token: ${{ secrets.dispatch_token }}
      dispatch-token: ${{ secrets['dispatch-token'] }}
