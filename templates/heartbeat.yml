name: Heartbeat
on:
  schedule:
    - cron: '15 */6 * * *'  # Every 6 hours at 15 minutes past the hour (avoiding peak times)
  workflow_dispatch:
  workflow_call:
    inputs:
      engine_ref:
        required: false
        type: string
        description: "Engine ref to use"
    secrets:
      DISPATCH_TOKEN:
        required: true
jobs:
  heartbeat:
    runs-on: [self-hosted, pve-linux]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Install infraro engine
        run: pip install git+https://github.com/hdot123/infraro-core.git@v0.18.4
      
      - name: Run heartbeat check
        run: infraro heartbeat --repo ${{ github.repository }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
