# Evolution Scanner thin caller（r38 consumer-template-reconciliation）。
# 文件名契约：本仓文件必须为 evolution-scan.yml——heartbeat 引擎按
# SCANNER_WORKFLOW = "evolution-scan.yml" 经 gh run list --workflow 解析
# 扫描器存活并经 gh workflow run 自愈拉起（engine evolution-heartbeat）。
#
# 触发面契约（对齐参照消费仓形态）：schedule（INFRA-578 错峰分钟位）+
# workflow_dispatch（自愈拉起必需）。执行体委托引擎 reusable；engine_ref
# 缺省走 job.workflow_sha（caller uses@tag 锚定的引擎 commit）。
# snake-only 单形态 secrets 转发（SNAKE-CONVERGENCE）。
#
# INFRA-578: cron 分钟位避开 :00/:30（GitHub 高峰 load-shed drop 窗口）。
# INFRA-588: heartbeat 自身被 drop 时，扫描器 watch_heartbeat_channel
# （infra-core 引擎）会 workflow_dispatch 反向拉起 evolution-heartbeat.yml。

name: Evolution Scan

on:
  schedule:
    - cron: '13,43 * * * *'
  workflow_dispatch: {}

concurrency:
  group: evolution-scan
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  scan:
    # INFRA-651: reusable 模板引用钉 tag，与引擎 pin 同版本；禁止 @main 浮动。
    uses: hdot123/infraro-core/.github/workflows/evolution-scan.yml@v0.18.6
    # INFRA-692: dispatch head whitelist fail-closed guard (E1-5)
    # Only allow dispatch from whitelisted heads; reject non-whitelisted with exit 1.
    if: |
      github.event_name != 'workflow_dispatch' ||
      contains(
        'refs/heads/main|refs/heads/hotfix/*|refs/heads/feature/*',
        github.ref
      )
    with:
      engine_ref: v0.18.6
      runner: self-hosted,pve-linux
    permissions:
      contents: read
      issues: write
    secrets:
      dispatch_token: ${{ secrets.DISPATCH_TOKEN }}
      linear_api_key: ${{ secrets.LINEAR_API_KEY }}
